name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - main
    paths-ignore:
      - '*.md'

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          path: src

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: builds
          path: builds

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build cloudstream gradle plugin from source
        run: |
          # JitPack's artifacts for recloudstream/gradle are corrupt server-side
          # (Sep 2026: snapshot timestamp "aster-<sha>", stub poms, 292-byte jars
          # for every version), so build the plugin from source and publish to
          # mavenLocal, which build.gradle.kts picks up first. Pinned to upstream
          # master 32895aed (2026-07-02) — bump GRADLE_PLUGIN_SHA to update.
          GRADLE_PLUGIN_SHA=32895aedb6366f5075cb99bbd2e6ce0a7cac325d
          git clone --depth 1 https://github.com/recloudstream/gradle.git $GITHUB_WORKSPACE/upstream-gradle
          cd $GITHUB_WORKSPACE/upstream-gradle
          git fetch --depth 1 origin $GRADLE_PLUGIN_SHA
          git checkout $GRADLE_PLUGIN_SHA
          chmod +x gradlew
          ./gradlew publishToMavenLocal

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          chmod +x gradlew
          ./gradlew make makePluginsJson
          shopt -s globstar nullglob
          for f in extensions/**/build/*.cs3; do
            [ -e "$f" ] && cp "$f" $GITHUB_WORKSPACE/builds
          done
          cp build/plugins.json $GITHUB_WORKSPACE/builds/plugins.json

      - name: Write repo.json to source
        run: |
          echo '{' > repo.json
          echo '  "iconUrl": "https://ntv.st/favicon.ico",' >> repo.json
          echo '  "name": "NTV Live",' >> repo.json
          echo '  "description": "Live sports streaming from ntv.st (24/7 channels + events)",' >> repo.json
          echo '  "manifestVersion": 1,' >> repo.json
          echo '  "pluginLists": [' >> repo.json
          echo '    "https://raw.githubusercontent.com/Lumusi/NTV-Cloudstream/builds/plugins.json"' >> repo.json
          echo '  ]' >> repo.json
          echo '}' >> repo.json
          cp repo.json $GITHUB_WORKSPACE/src/repo.json

      - name: Verify build artifacts
        run: |
          echo "=== plugins.json ==="
          cat $GITHUB_WORKSPACE/builds/plugins.json
          echo "=== .cs3 files ==="
          ls -la $GITHUB_WORKSPACE/builds/*.cs3 || { echo "ERROR: No .cs3 files found"; exit 1; }
          echo "=== repo.json ==="
          cat repo.json

      - name: Push builds branch
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force

      - name: Push repo.json to main
        run: |
          cd $GITHUB_WORKSPACE/src
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add repo.json
          git commit -m "[skip ci] Update repo.json for Cloudstream3" || true
          git push origin main || true
